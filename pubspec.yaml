name: library_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

# ----- Different versions per platform -----
# flutter build apk --split-per-abi && open build/app/outputs/flutter-apk/
# flutter build apk --release --build-name=1.0.0 --build-number=10 && open build/app/outputs/flutter-apk/    # Android
# flutter build aab --release --build-name=1.0.0 --build-number=10 && open build/app/outputs/bundle/release/    # Android
# flutter build ios --release --build-name=1.0.0 --build-number=9    # iOS
# flutter build ipa --build-name=1.0.3 --build-number=01    # iOS

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.0.0
  dio: ^5.11.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  go_router: ^14.8.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mobile_scanner: ^7.4.2
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
